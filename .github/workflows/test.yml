name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # README 与真实代码的一致性（幽灵 API / 模块索引缺漏）——见 scripts/check_docs.clj
  # （必须跑 JVM Clojure：门禁要 require 全部源码 ns 再 ns-resolve，bb 跑不动；
  #   bb 在这里只是任务入口。）
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest
          bb: latest

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-deps-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Check docs match code
        run: bb check-docs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ clj-agent-core, clj-agent-client, clj-agent-provider, clj-agent-agui ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest
          bb: latest

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-deps-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      # 与本地同一条命令（bb.edn 的 test 任务），避免 CI 与脚本各跑各的
      - name: Run tests (${{ matrix.module }})
        run: bb test ${{ matrix.module }}
